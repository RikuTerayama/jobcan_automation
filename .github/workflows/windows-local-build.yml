name: Windows local app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "automation.py"
      - "local_*.py"
      - "templates/autofill_flow.html"
      - "templates/includes/local_*.html"
      - "JobcanTool.spec"
      - "requirements-local.txt"
      - "requirements-build.txt"
      - "scripts/build_windows_local.ps1"
      - "scripts/windows_local_smoke.py"
      - "tests/test_local_*.py"
  push:
    tags:
      - "jobcan-tool-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Build and test
        shell: powershell
        run: .\scripts\build_windows_local.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JobcanTool-windows-x64
          path: dist/JobcanTool-windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/jobcan-tool-v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/JobcanTool-windows-x64.zip" --generate-notes
